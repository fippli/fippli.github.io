<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phylarium">
  <title>Phylarium</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-label="Tap the sun to heat the planet"></canvas>

  <div id="app">
    <header id="hud">
      <div id="temp" class="temp">-238.1°C</div>
      <div id="temp-sub" class="temp-sub">35 K · Dark planet</div>
      <div id="hud-line" class="hud-line"></div>
    </header>

    <div id="main">
      <div id="column">
        <div class="spacer"></div>

        <section id="sheet">
      <main id="panel">
        <div id="world">
          <h3>Planet</h3>
          <dl id="stats" class="stats"></dl>
          <button id="reset" class="danger">Reset game</button>
          <p id="version" class="version"></p>
        </div>
      </main>
        </section>
      </div>
    </div>
  </div>

  <div id="gameover" class="hidden" role="dialog" aria-labelledby="gameover-title">
    <div class="gameover-box">
      <h2 id="gameover-title">Game over</h2>
      <p id="gameover-reason"></p>
      <dl id="gameover-stats" class="stats"></dl>
      <button id="gameover-restart">Start a new planet</button>
    </div>
  </div>

  <button id="update" class="update hidden">New version ready · tap to reload</button>

  <div id="fx"></div>

  <script src="version.js"></script>
  <script src="sprites.js"></script>
  <script src="terrain.js"></script>
  <script src="scene.js"></script>
  <script src="game.js"></script>
</body>
</html>
